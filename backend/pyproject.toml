[project]
name = "meu-nas-backend"
version = "0.1.0"
description = "Backend FastAPI para NAS customizado em Raspberry Pi"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20.0",
  "bcrypt>=4.1.0",
  "fastapi>=0.111.0",
  "psutil>=5.9.8",
  "pydantic-settings>=2.3.0",
  "PyJWT>=2.8.0",
  "SQLAlchemy>=2.0.30",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
