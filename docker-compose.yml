# PiNAS — Docker Compose
#
# IMPORTANTE: Este arquivo contém os DEFAULTS do projeto.
# Configurações específicas do seu host (UID:GID, portas, caminhos)
# são geradas pelo bootstrap.sh em docker-compose.override.yml.
# Você não precisa editar este arquivo.

services:
  pinas-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: pinas/api:latest
    container_name: pinas-api
    restart: unless-stopped
    environment:
      PINAS_ENV: ${PINAS_ENV:-production}
      PINAS_BIND: 0.0.0.0:8080
      PINAS_DB_PATH: /var/lib/pinas/db/pinas.db
      PINAS_DATA_DIR: /var/lib/pinas/data
      PINAS_THUMBS_DIR: /var/lib/pinas/thumbs
      PINAS_LOGS_DIR: /var/lib/pinas/logs
      PINAS_SECRETS_DIR: /var/lib/pinas/secrets
      PINAS_ADMIN_USERNAME: ${PINAS_ADMIN_USERNAME:-admin}
      PINAS_ADMIN_PASSWORD: ${PINAS_ADMIN_PASSWORD}
      PINAS_JWT_TTL: 15m
      PINAS_REFRESH_TTL: 168h
      PINAS_ALLOWED_ORIGIN: ${PINAS_ALLOWED_ORIGIN:-https://pinas.local}
      PINAS_LOG_LEVEL: ${PINAS_LOG_LEVEL:-info}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - /srv/pinas/db:/var/lib/pinas/db
      - /srv/pinas/secrets:/var/lib/pinas/secrets
      - /srv/pinas/thumbs:/var/lib/pinas/thumbs
      - /srv/pinas/logs:/var/lib/pinas/logs
      # Pasta de dados — sobrescrita pelo override.yml gerado pelo bootstrap.
      # Default aqui é /srv/pinas/data, mas o bootstrap pode apontar pra
      # /home/<user> ou um disco USB conforme detectado.
      - /srv/pinas/data:/var/lib/pinas/data
    networks:
      - pinas
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # GET via wget (HEAD não é suportado pelo endpoint).
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/healthz | grep -q ok || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: pinas-caddy
    restart: unless-stopped
    ports:
      # Portas padrão. O bootstrap detecta conflitos (Pi-hole, nginx, etc)
      # e gera docker-compose.override.yml com portas alternativas (8080/8443).
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PINAS_HOST: ${PINAS_HOST:-pinas.local}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/build:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      pinas-api:
        condition: service_healthy
    networks:
      - pinas
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  pinas:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
