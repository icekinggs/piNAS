# PiNAS — Docker Compose
# Roda Caddy (reverse proxy + TLS interno) e o backend Go.
# Samba, sshd, ufw e fail2ban ficam no host (NÃO containerizados).

services:
  pinas-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: pinas/api:latest
    container_name: pinas-api
    restart: unless-stopped
    environment:
      PINAS_ENV: ${PINAS_ENV:-production}
      PINAS_BIND: 0.0.0.0:8080
      PINAS_DB_PATH: /var/lib/pinas/db/pinas.db
      PINAS_DATA_DIR: /var/lib/pinas/data
      PINAS_THUMBS_DIR: /var/lib/pinas/thumbs
      PINAS_LOGS_DIR: /var/lib/pinas/logs
      PINAS_SECRETS_DIR: /var/lib/pinas/secrets
      PINAS_ADMIN_USERNAME: ${PINAS_ADMIN_USERNAME:-admin}
      PINAS_ADMIN_PASSWORD: ${PINAS_ADMIN_PASSWORD}
      PINAS_JWT_TTL: 15m
      PINAS_REFRESH_TTL: 168h
      PINAS_ALLOWED_ORIGIN: ${PINAS_ALLOWED_ORIGIN:-https://pinas.local}
      PINAS_LOG_LEVEL: ${PINAS_LOG_LEVEL:-info}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      # Persistência: banco, secrets, thumbs, logs.
      - /srv/pinas/db:/var/lib/pinas/db
      - /srv/pinas/secrets:/var/lib/pinas/secrets
      - /srv/pinas/thumbs:/var/lib/pinas/thumbs
      - /srv/pinas/logs:/var/lib/pinas/logs
      # Disco do usuário (montagem do USB no host -> jail dentro do container).
      - /srv/pinas/data:/var/lib/pinas/data
    networks:
      - pinas
    # Métricas do host (CPU/RAM/temp) precisam de leitura de /proc e /sys.
    # Read-only para minimizar superfície.
    read_only: false
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/v1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Limites pensados para Raspberry Pi 4 (4GB).
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: pinas-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"     # HTTP/3
    environment:
      PINAS_HOST: ${PINAS_HOST:-pinas.local}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/build:/srv/frontend:ro    # build estático do SvelteKit
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      pinas-api:
        condition: service_healthy
    networks:
      - pinas
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  pinas:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
